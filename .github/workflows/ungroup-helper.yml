# Fork only: builds the personal Ungroup stopgap. Never part of a PR to storytold/pdfcraft.
name: Ungroup helper

on:
  push:
    branches: [chore/ungroup-helper]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
        shell: bash
      - run: cargo clippy --release -p pdfcraft-ungroup --all-targets -- -D warnings
      - run: cargo test --release -p pdfcraft-ungroup
      - run: cargo build --release -p pdfcraft-ungroup
      - uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-ungroup-windows
          path: target/release/pdfcraft-ungroup.exe
          retention-days: 90
